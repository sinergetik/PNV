<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Сканер v13 — LiDAR ПНВ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0;
    background: #060911; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  body.xr-active { background: transparent !important; }
  body.xr-active header,
  body.xr-active main { display: none !important; }
  body.xr-active #xrOverlayUI { display: flex !important; }

  /* Компактная верхняя панель */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(15, 23, 42, 0.95);
    border-bottom: 1px solid rgba(56, 189, 248, 0.2);
    padding: 8px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .btn-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  button {
    border: 1px solid #334155;
    background: #1e293b; color: #f8fafc;
    border-radius: 10px; padding: 8px 11px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.96); opacity: 0.85; }
  .btn-primary {
    background: linear-gradient(90deg, #06b6d4, #14b8a6);
    color: #020617; border: none; font-weight: 700;
  }
  .btn-lidar {
    background: rgba(16, 185, 129, 0.22);
    color: #6ee7b7; border-color: rgba(16, 185, 129, 0.55);
  }
  .btn-nv {
    background: rgba(34, 197, 94, 0.22);
    color: #86efac; border-color: rgba(34, 197, 94, 0.6);
  }
  .btn-active {
    border-color: #00f5d4 !important;
    background: rgba(6, 182, 212, 0.18) !important;
    color: #fff !important;
  }

  main {
    max-width: 1100px; margin: 0 auto; padding: 10px;
    display: grid; grid-template-columns: 1fr; gap: 10px;
  }
  @media (min-width: 900px) {
    main { grid-template-columns: 2fr 1fr; }
  }

  #viewportBox {
    position: relative;
    width: 100%; height: 470px;
    background: #04070e;
    border: 1px solid rgba(0, 245, 212, 0.28);
    border-radius: 16px;
    overflow: hidden;
    touch-action: none;
  }
  #main3DCanvas { width: 100%; height: 100%; display: block; }

  #orbitRadarBox {
    position: absolute; top: 10px; left: 10px; z-index: 20;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(0, 245, 212, 0.3);
    border-radius: 50%; padding: 4px;
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }

  .hud-top-right {
    position: absolute; top: 10px; right: 10px; z-index: 20;
    display: flex; gap: 6px;
  }

  #pipBox {
    position: absolute; bottom: 10px; left: 10px; z-index: 20;
    width: 136px; height: 102px;
    background: #020617;
    border: 1px solid rgba(0, 245, 212, 0.5);
    border-radius: 12px; overflow: hidden;
    display: none;
  }
  #webcamVideo {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  .pip-crop-guide {
    position: absolute; inset: 16%; z-index: 4;
    border: 1.5px dashed rgba(0, 245, 212, 0.85);
    border-radius: 50%; pointer-events: none;
  }

  .hud-bottom-right {
    position: absolute; bottom: 10px; right: 10px; z-index: 20;
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
  }

  .card {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.18);
    border-radius: 14px; padding: 11px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }

  .slider-group { display: flex; flex-direction: column; gap: 4px; }
  .slider-header { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; }
  .slider-val { color: #22d3ee; font-weight: 700; }
  input[type="range"] {
    width: 100%; height: 7px; border-radius: 99px;
    background: #1e293b; outline: none; -webkit-appearance: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: #00f5d4; cursor: pointer;
  }

  .export-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-radius: 12px;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(56, 189, 248, 0.2);
    font-size: 12px;
  }

  /* ARKit LiDAR оверлей (Включает и 3D-сканер, и Лазерный ПНВ с LiDAR-сеткой!) */
  #xrOverlayUI {
    position: fixed; inset: 0; z-index: 9999;
    display: none; flex-direction: column; justify-content: space-between;
    padding: 14px; pointer-events: none;
  }
  #xrHudCanvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 9998;
  }
  .xr-top-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    z-index: 10000; pointer-events: auto;
  }
  .xr-reticle {
    align-self: center;
    width: 90px; height: 90px;
    border: 1.5px solid rgba(34, 197, 94, 0.85);
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 24px rgba(34, 197, 94, 0.35);
  }
  .xr-reticle-dot { width: 5px; height: 5px; border-radius: 50%; background: #4ade80; }
  #xrCenterDistTag {
    margin-top: 6px; font-size: 11px; font-weight: 700;
    color: #4ade80; background: rgba(2, 18, 6, 0.85);
    padding: 2px 6px; border-radius: 6px;
  }
  .xr-bottom-panel {
    background: rgba(2, 12, 6, 0.9);
    border: 1px solid rgba(34, 197, 94, 0.4);
    border-radius: 16px; padding: 11px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 10000; pointer-events: auto;
  }

  /* Окно ПНВ для обычного браузера (Гибрид: Камера + Радар) */
  #nvStandaloneModal {
    position: fixed; inset: 0; z-index: 12000;
    background: #010803;
    display: none; flex-direction: column; justify-content: space-between;
  }
  #nvStandaloneCanvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 1;
  }
  .nv-crt-overlay {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22), rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px);
    box-shadow: inset 0 0 80px rgba(34, 197, 94, 0.35);
  }
  .nv-top-bar {
    position: relative; z-index: 5; padding: 12px;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(2, 18, 6, 0.88);
  }
  .nv-bottom-bar {
    position: relative; z-index: 5; padding: 14px;
    background: rgba(2, 18, 6, 0.92);
    border-top: 1px solid rgba(34, 197, 94, 0.4);
    display: flex; flex-direction: column; gap: 8px;
  }
</style>
</head>
<body>

  <!-- Отдельное окно ПНВ (с кнопкой запуска аппаратного LiDAR-радара + ИК-матрицей глубин) -->
  <div id="nvStandaloneModal" class="mono">
    <canvas id="nvStandaloneCanvas"></canvas>
    <div class="nv-crt-overlay"></div>

    <div class="nv-top-bar">
      <strong style="color:#4ade80; font-size:13px;">👁 ПНВ + LiDAR МАТРИЦА</strong>
      <div class="btn-row">
        <button type="button" id="btnNvActivateLiDAR" style="background:#065f46; border-color:#34d399; color:#a7f3d0;">📡 Вкл. LiDAR Луч</button>
        <button type="button" id="btnNvSwitchCam" style="background:#052e16; border-color:#22c55e; color:#86efac;">🔄 Камера</button>
        <button type="button" id="btnCloseNV" style="background:#dc2626; border-color:#f87171; color:#fff;">✕</button>
      </div>
    </div>

    <div class="nv-bottom-bar">
      <div style="display:flex; justify-content:space-between; font-size:12px; color:#86efac;">
        <span>ИК-Усиление: <strong id="nvGainLabel">4.5x</strong></span>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="chkNvLidarGrid" checked style="width:16px; height:16px;">
          <span>Лазерная сетка глубины</span>
        </label>
      </div>
      <input id="sliderNvModalGain" type="range" min="1.0" max="9.0" step="0.5" value="4.5">
    </div>
  </div>

  <!-- Полноэкранный Аппаратный LiDAR режим (Работает и как ПНВ в полной темноте, и как 3D-сканер) -->
  <canvas id="xrHudCanvas"></canvas>
  <div id="xrOverlayUI" class="mono">
    <div class="xr-top-bar">
      <div class="btn-row">
        <button type="button" id="btnXrModeNV" class="btn-active" style="background:#052e16; border-color:#22c55e; color:#4ade80;">
          👁 ПНВ + LiDAR (Без записи)
        </button>
        <button type="button" id="btnXrModeScan" style="background:#0f172a; border-color:#38bdf8; color:#7dd3fc;">
          ⏺ Запись 3D-модели
        </button>
      </div>
      <button type="button" id="btnFinishXR" style="background:#dc2626; border-color:#f87171; color:#fff; font-weight:800;">✕ Выход</button>
    </div>

    <div class="xr-reticle">
      <div class="xr-reticle-dot"></div>
      <div id="xrCenterDistTag">— м</div>
    </div>

    <div class="xr-bottom-panel">
      <div style="display:flex; justify-content:space-between; font-size:11px; color:#86efac;">
        <span>Дальность лазера LiDAR:</span>
        <strong id="xrRangeVal" style="color:#4ade80;">3.5 м</strong>
      </div>
      <input id="sliderXrRange" type="range" min="0.4" max="5.0" step="0.1" value="3.5">

      <div style="display:flex; justify-content:space-between; gap:6px;">
        <button type="button" id="btnLockCenterXR" style="background:#064e3b; border-color:#10b981;">🎯 Центр</button>
        <button type="button" id="btnClearXR" style="background:#064e3b; border-color:#10b981;">🗑 Очистить сетку</button>
        <button type="button" id="btnSaveScanXR" style="background:#10b981; color:#022c22; font-weight:800;">✓ В 3D-редактор</button>
      </div>
    </div>
  </div>

  <!-- Верхняя панель кнопок -->
  <header>
    <div class="btn-row">
      <button type="button" id="btnSwitchCam">🔄 Камера</button>
      <button type="button" id="btnOpenNVWindow" class="btn-nv">👁 ПНВ + LiDAR</button>
    </div>
    <div class="btn-row">
      <button type="button" id="btnStartLiDAR" class="btn-lidar">📡 LiDAR 3D</button>
      <button type="button" id="btnStartGyroScan" class="btn-primary">🔄 <span id="btnGyroScanText">360° Скан</span></button>
    </div>
  </header>

  <main>
    <!-- 3D Вьюпорт -->
    <div>
      <div id="viewportBox">
        <canvas id="main3DCanvas"></canvas>

        <div id="orbitRadarBox">
          <canvas id="orbitRadarCanvas" width="42" height="42"></canvas>
        </div>

        <div class="hud-top-right">
          <button type="button" id="btnFillCap" class="btn-active" style="padding:6px 9px; font-size:11px;" title="Закрыть крышку и дно объекта">🔴 Крышка</button>
          <button type="button" id="btnGyroViewLink" style="padding:6px 9px; font-size:11px;">📲 Гиро</button>
          <button type="button" id="btnAutoRotate" style="padding:6px 9px; font-size:11px;">🔄 Вращ.</button>
          <button type="button" id="btnResetView" style="padding:6px 9px; font-size:11px;">🎯 Центр</button>
        </div>

        <div id="pipBox">
          <video id="webcamVideo" autoplay playsinline muted webkit-playsinline></video>
          <div class="pip-crop-guide" id="pipCropBox"></div>
        </div>

        <div class="hud-bottom-right">
          <button type="button" id="btnSnapSector" style="background:#0284c7; border-color:#38bdf8; display:none;">
            ➕ Кадр
          </button>
          <button type="button" id="btnClearScene" style="background:#0f172a; border-color:#475569;">
            🗑 Сброс
          </button>
          <button type="button" id="btnFreeze" style="background:#0f172a; border-color:#00f5d4;">
            <span id="freezeBtnText">❄️ Стоп</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Панель управления -->
    <div style="display:flex; flex-direction:column; gap:10px;">

      <div class="card">
        <div class="grid-4">
          <button type="button" data-style="points" class="style-btn" style="font-size:11px; padding:7px 4px; justify-content:center;">⁙ Точки</button>
          <button type="button" data-style="solid" class="style-btn btn-active" style="font-size:11px; padding:7px 4px; justify-content:center;">🧊 Полигоны</button>
          <button type="button" data-style="combined" class="style-btn" style="font-size:11px; padding:7px 4px; justify-content:center;">⚡ Гибрид</button>
          <button type="button" data-style="wireframe" class="style-btn" style="font-size:11px; padding:7px 4px; justify-content:center;">🕸 Сетка</button>
        </div>

        <div class="grid-4">
          <button type="button" data-color="rgb" class="color-btn btn-active" style="font-size:11px; padding:6px; justify-content:center;">Цвет</button>
          <button type="button" data-color="lidar" class="color-btn" style="font-size:11px; padding:6px; justify-content:center;">Циан</button>
          <button type="button" data-color="heatmap" class="color-btn" style="font-size:11px; padding:6px; justify-content:center;">Высота</button>
          <button type="button" data-color="night" class="color-btn" style="font-size:11px; padding:6px; justify-content:center; color:#86efac;">Зеленый</button>
        </div>
      </div>

      <div class="card">
        <div class="slider-group">
          <div class="slider-header">
            <span>Фокус на центре (отсечь стол/края)</span>
            <span id="valCropFocus" class="slider-val mono">65%</span>
          </div>
          <input id="sliderCropFocus" type="range" min="30" max="90" step="5" value="65">
        </div>

        <div class="slider-group">
          <div class="slider-header">
            <span>Отсечение фона (контраст объекта)</span>
            <span id="valThreshold" class="slider-val mono">30%</span>
          </div>
          <input id="sliderThreshold" type="range" min="10" max="80" step="5" value="30">
        </div>

        <div class="slider-group">
          <div class="slider-header">
            <span>Конусность / Объем (Форма стакана)</span>
            <span id="valDepthScale" class="slider-val mono">0.9x</span>
          </div>
          <input id="sliderDepthScale" type="range" min="0.3" max="2.2" step="0.1" value="0.9">
        </div>

        <label style="display:flex; justify-content:space-between; align-items:center; font-size:12px; padding-top:2px; cursor:pointer;">
          <span>Авто-захват при обходе (каждые 15°)</span>
          <input id="chkAutoOrbitCapture" type="checkbox" checked style="width:18px; height:18px;">
        </label>
      </div>

      <div class="export-bar">
        <span style="color:#94a3b8;">💾 Экспорт:</span>
        <div class="btn-row">
          <button type="button" id="btnExportOBJ" class="mono" style="padding:6px 12px; color:#22d3ee; border-color:#0891b2;">.OBJ</button>
          <button type="button" id="btnExportPLY" class="mono" style="padding:6px 12px; color:#6ee7b7; border-color:#059669;">.PLY</button>
        </div>
      </div>

    </div>
  </main>

<script>
(function() {
  var state = {
    mode: 'orbit',
    vizStyle: 'solid',    // По умолчанию плотные полигоны (как на скрине пользователя)
    colorTheme: 'rgb',
    depthScale: 0.9,
    cropFocus: 0.65,
    bgThreshold: 0.30,
    fillTopCap: true,     // Закрывать отверстие крышки сверху, чтобы не было черной дыры!
    autoOrbitCapture: true,
    isCameraActive: false,
    facingMode: 'environment',
    isFrozen: false,
    autoRotate: false,
    gyroViewControl: false,
    yaw: 0.4,
    pitch: 0.42,
    zoom: 2.3,
    gyroEnabled: false,
    rawAlpha: 0,
    baseAlpha: null,
    gyroYawRad: 0,
    gyroPitchRad: 0.3,
    sectorsCaptured: new Uint8Array(24),
    lastCapturedSector: -1,
    voxelMap: new Map(),
    meshTriangles: [],
    meshDirty: false,
    // XR LiDAR + ПНВ состояние
    xrSession: null,
    xrIsNightVisionOnly: false, // Если true — режим ПНВ с живым LiDAR радаром без накопления 3D-комка
    xrRecording: true,
    xrMaxRange: 3.5,
    xrCenterAnchor: null,
    xrRadarNodes: [],           // Живые точки лазерной сетки ПНВ (обновляются в реальном времени)
    // Окно ПНВ
    nvModalOpen: false,
    nvGain: 4.5,
    nvShowLidarGrid: true
  };

  var videoEl = document.getElementById('webcamVideo');
  var mainCanvas = document.getElementById('main3DCanvas');
  var ctx = mainCanvas.getContext('2d');
  var orbitRadarCanvas = document.getElementById('orbitRadarCanvas');
  var radarCtx = orbitRadarCanvas.getContext('2d');
  var xrHudCanvas = document.getElementById('xrHudCanvas');
  var xrHudCtx = xrHudCanvas.getContext('2d');
  var sampleCanvas = document.createElement('canvas');
  var sampleCtx = sampleCanvas.getContext('2d');

  var MAX_VERTS = 18000;
  var vertsX = new Float32Array(MAX_VERTS);
  var vertsY = new Float32Array(MAX_VERTS);
  var vertsZ = new Float32Array(MAX_VERTS);
  var vertsR = new Uint8Array(MAX_VERTS);
  var vertsG = new Uint8Array(MAX_VERTS);
  var vertsB = new Uint8Array(MAX_VERTS);
  var activeVertCount = 0;

  function applyColorScheme(normY, r, g, b) {
    var c = Math.max(0, Math.min(1, normY));
    if (state.colorTheme === 'rgb' && r !== undefined) {
      return [r, g, b];
    } else if (state.colorTheme === 'lidar') {
      return [Math.round(15 + c * 40), Math.round(140 + c * 110), Math.round(170 + c * 85)];
    } else if (state.colorTheme === 'heatmap') {
      return [
        Math.round(Math.min(255, Math.max(0, (c - 0.35) * 400))),
        Math.round(Math.sin(c * Math.PI) * 245),
        Math.round(Math.min(255, Math.max(0, (0.65 - c) * 400)))
      ];
    } else {
      return [Math.round(15 + c * 45), Math.round(95 + c * 160), Math.round(25 + c * 60)];
    }
  }

  // =========================================================
  // 1. ГИРОСКОП
  // =========================================================
  function onDeviceOrientation(e) {
    if (e.alpha === null && e.beta === null) return;
    state.gyroEnabled = true;

    var alpha = e.alpha || 0;
    var beta = e.beta || 60;
    if (state.baseAlpha === null) state.baseAlpha = alpha;

    var relAlpha = (alpha - state.baseAlpha + 360) % 360;
    state.rawAlpha = relAlpha;
    state.gyroYawRad = (relAlpha * Math.PI) / 180;

    var pitchDeg = Math.max(-60, Math.min(70, 80 - beta));
    state.gyroPitchRad = (pitchDeg * Math.PI) / 180;

    if (state.gyroViewControl && state.isFrozen) {
      state.yaw = state.gyroYawRad;
      state.pitch = state.gyroPitchRad;
    }

    if (state.isCameraActive && !state.isFrozen && state.mode === 'orbit' && state.autoOrbitCapture) {
      var sector = Math.floor(relAlpha / 15) % 24;
      if (sector !== state.lastCapturedSector) {
        state.lastCapturedSector = sector;
        captureObjectFrameWithCap(sector);
      }
    }
  }

  function enableGyro(cb) {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function(res) {
        if (res === 'granted') {
          window.addEventListener('deviceorientation', onDeviceOrientation, true);
          state.gyroEnabled = true;
        }
        if (cb) cb();
      }).catch(function() {
        window.addEventListener('deviceorientation', onDeviceOrientation, true);
        if (cb) cb();
      });
    } else {
      window.addEventListener('deviceorientation', onDeviceOrientation, true);
      state.gyroEnabled = true;
      if (cb) cb();
    }
  }

  function drawOrbitRadar() {
    var w = 42, h = 42, cx = 21, cy = 21, rOut = 18, rIn = 8;
    radarCtx.clearRect(0, 0, w, h);
    for (var s = 0; s < 24; s++) {
      var a0 = (s * 15 - 90) * (Math.PI / 180);
      var a1 = ((s + 1) * 15 - 92) * (Math.PI / 180);
      radarCtx.beginPath();
      radarCtx.arc(cx, cy, rOut, a0, a1);
      radarCtx.arc(cx, cy, rIn, a1, a0, true);
      radarCtx.closePath();
      radarCtx.fillStyle = state.sectorsCaptured[s] ? '#10b981' : 'rgba(51, 65, 85, 0.5)';
      radarCtx.fill();
    }
    var curA = state.gyroYawRad - Math.PI * 0.5;
    radarCtx.strokeStyle = '#00f5d4';
    radarCtx.lineWidth = 2;
    radarCtx.beginPath();
    radarCtx.moveTo(cx, cy);
    radarCtx.lineTo(cx + Math.cos(curA) * 19, cy + Math.sin(curA) * 19);
    radarCtx.stroke();
  }

  // =========================================================
  // 2. 3D-РЕКОНСТРУКЦИЯ СТАКАНЧИКА С ЗАКРЫТОЙ КРЫШКОЙ (БЕЗ ЧЕРНОЙ ДЫРЫ СВЕРХУ!)
  // =========================================================
  var VOXEL_SIZE = 0.02;

  function putVoxel(wx, wy, wz, r, g, b, minHits) {
    var vx = Math.floor(wx / VOXEL_SIZE);
    var vy = Math.floor(wy / VOXEL_SIZE);
    var vz = Math.floor(wz / VOXEL_SIZE);
    var key = vx + ',' + vy + ',' + vz;

    var cell = state.voxelMap.get(key);
    if (!cell) {
      cell = { x: wx, y: wy, z: wz, r: r, g: g, b: b, hits: 1, confirmed: false, idx: -1 };
      state.voxelMap.set(key, cell);
    } else {
      cell.hits++;
      cell.x = cell.x * 0.55 + wx * 0.45;
      cell.y = cell.y * 0.55 + wy * 0.45;
      cell.z = cell.z * 0.55 + wz * 0.45;
      cell.r = (cell.r + r) >> 1;
      cell.g = (cell.g + g) >> 1;
      cell.b = (cell.b + b) >> 1;
    }

    if (!cell.confirmed && cell.hits >= minHits && activeVertCount < MAX_VERTS) {
      cell.confirmed = true;
      var id = activeVertCount++;
      cell.idx = id;
      vertsX[id] = cell.x; vertsY[id] = cell.y; vertsZ[id] = cell.z;
      var rgb = applyColorScheme((cell.y + 0.5) / 1.0, cell.r, cell.g, cell.b);
      vertsR[id] = rgb[0]; vertsG[id] = rgb[1]; vertsB[id] = rgb[2];
      state.meshDirty = true;
    } else if (cell.confirmed && cell.idx >= 0) {
      var id2 = cell.idx;
      vertsX[id2] = cell.x; vertsY[id2] = cell.y; vertsZ[id2] = cell.z;
    }
  }

  function captureObjectFrameWithCap(sectorIndex) {
    if (!state.isCameraActive || videoEl.readyState < 2) return;

    var rx = 42, ry = 42;
    sampleCanvas.width = rx;
    sampleCanvas.height = ry;
    sampleCtx.drawImage(videoEl, 0, 0, rx, ry);
    var img = sampleCtx.getImageData(0, 0, rx, ry).data;

    // Оценка цвета стола по углам
    var bgR = 0, bgG = 0, bgB = 0, bgCount = 0;
    for (var bx = 0; bx < rx; bx += 2) {
      var tIdx = bx * 4, bIdx = ((ry - 1) * rx + bx) * 4;
      bgR += img[tIdx] + img[bIdx];
      bgG += img[tIdx + 1] + img[bIdx + 1];
      bgB += img[tIdx + 2] + img[bIdx + 2];
      bgCount += 2;
    }
    bgR /= bgCount; bgG /= bgCount; bgB /= bgCount;

    var theta = state.gyroYawRad;
    var cosT = Math.cos(theta), sinT = Math.sin(theta);

    var maxRad = 1.05 - state.cropFocus * 0.65;
    var maxRadSq = maxRad * maxRad;
    var thresh = state.bgThreshold;

    var topR = 210, topG = 45, topB = 45, topSamples = 0;
    var maxYFound = -1;

    for (var y = 2; y < ry - 2; y++) {
      for (var x = 2; x < rx - 2; x++) {
        var nx = (x / (rx - 1) - 0.5) * 1.15;
        var ny = -(y / (ry - 1) - 0.5) * 1.15;
        if (nx * nx + ny * ny > maxRadSq) continue;

        var i4 = (y * rx + x) * 4;
        var r = img[i4], g = img[i4 + 1], b = img[i4 + 2];

        var maxC = Math.max(r, g, b), minC = Math.min(r, g, b);
        var sat = maxC > 0 ? (maxC - minC) / 255 : 0;
        var diffBg = (Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB)) / (255 * 3);

        if (diffBg + sat * 0.65 < thresh * 0.72) continue;

        // Если это верхняя треть объекта (крышка стаканчика) и включена опция "🔴 Крышка",
        // проецируем точки не только на стенку, но и внутрь горизонтального диска крышки (от края к центру 0,0)!
        var heightNorm = (ny + maxRad) / (2 * maxRad); // 0 внизу, 1 вверху
        // Конусность стаканчика: кверху чуть шире, книзу чуть уже
        var taper = 0.75 + heightNorm * 0.35;
        var cylCurve = Math.sqrt(Math.max(0.02, maxRadSq - nx * nx));
        var wallRadius = (0.20 + cylCurve * 0.25) * taper * state.depthScale;

        var localX = nx * 0.55 * taper;
        var localY = ny * 0.72;
        var localZ = wallRadius;

        var wx = localX * cosT + localZ * sinT;
        var wy = localY;
        var wz = -localX * sinT + localZ * cosT;

        putVoxel(wx, wy, wz, r, g, b, 1);

        if (heightNorm > 0.68) {
          topR += r; topG += g; topB += b; topSamples++;
          if (wy > maxYFound) maxYFound = wy;
        }
      }
    }

    // ЗАПОЛНЕНИЕ ПЛОСКОЙ КРЫШКИ СВЕРХУ (убирает черную дыру посередине стаканчика!)
    if (state.fillTopCap && topSamples > 3 && maxYFound > 0.05) {
      var capR = Math.round(topR / (topSamples + 1));
      var capG = Math.round(topG / (topSamples + 1));
      var capB = Math.round(topB / (topSamples + 1));
      var capRadius = 0.27 * state.depthScale;
      var capY = maxYFound * 0.92;

      for (var radStep = 0; radStep <= capRadius; radStep += VOXEL_SIZE * 0.9) {
        // Заполняем сектор диска крышки от центра (0,0) до края стенки
        var lx = Math.sin(theta) * radStep;
        var lz = Math.cos(theta) * radStep;
        // Бортик крышки чуть выше краев, серединка с легким углублением питейника
        var rimBump = (radStep > capRadius * 0.78) ? 0.018 : 0;
        putVoxel(lx, capY + rimBump, lz, capR, capG, capB, 1);
      }
    }

    if (sectorIndex !== undefined && sectorIndex >= 0 && sectorIndex < 24) {
      state.sectorsCaptured[sectorIndex] = 1;
    }
    state.yaw = theta + 0.35;
  }

  function buildCleanMeshIfNeeded() {
    if (!state.meshDirty) return;
    state.meshDirty = false;
    state.meshTriangles = [];
    var n = activeVertCount;
    if (n < 3) return;

    var maxEdgeSq = 0.042 * 0.042;
    for (var i = 0; i < n; i++) {
      var x0 = vertsX[i], y0 = vertsY[i], z0 = vertsZ[i];
      var n1 = -1, n2 = -1;
      var d1 = maxEdgeSq, d2 = maxEdgeSq;
      var startJ = Math.max(0, i - 110);

      for (var j = startJ; j < i; j++) {
        var dx = x0 - vertsX[j], dy = y0 - vertsY[j], dz = z0 - vertsZ[j];
        var dSq = dx * dx + dy * dy + dz * dz;
        if (dSq > 0.00004 && dSq < d1) {
          d2 = d1; n2 = n1; d1 = dSq; n1 = j;
        } else if (dSq > 0.00004 && dSq < d2) {
          d2 = dSq; n2 = j;
        }
      }
      if (n1 >= 0 && n2 >= 0) {
        var dx2 = vertsX[n1] - vertsX[n2], dy2 = vertsY[n1] - vertsY[n2], dz2 = vertsZ[n1] - vertsZ[n2];
        if (dx2 * dx2 + dy2 * dy2 + dz2 * dz2 < maxEdgeSq * 1.3) {
          state.meshTriangles.push(i, n1, n2);
        }
      }
    }
  }

  // =========================================================
  // 3. АППАРАТНЫЙ ПНВ + LiDAR (РАБОТАЕТ С НАСТОЯЩИМ ЛАЗЕРОМ LIDAR!)
  // =========================================================
  var xrGlCanvas = null, xrGl = null, xrRefSpace = null, xrHitTestSource = null;
  var lastViewMatrix = null, lastProjMatrix = null;

  // Широкая ИК-матрица из 49 лучей LiDAR (7x7) для сканирования темноты в ПНВ
  var lidarMatrixRays = [];
  for (var gy = -3; gy <= 3; gy++) {
    for (var gx = -3; gx <= 3; gx++) {
      lidarMatrixRays.push({ x: gx * 0.11, y: gy * 0.11, gx: gx, gy: gy });
    }
  }
  var rayCursor = 0;

  function registerRadarNodeForNV(hx, hy, hz, dist, gx, gy) {
    // Сохраняем живой лазерный узел для отображения ПНВ-сетки и дистанции в метрах
    state.xrRadarNodes.push({
      x: hx, y: hy, z: hz,
      dist: dist,
      gx: gx, gy: gy,
      t: performance.now()
    });
    if (state.xrRadarNodes.length > 180) {
      state.xrRadarNodes.shift();
    }
  }

  function onARKitHit(hx, hy, hz, camPos, gx, gy) {
    var dist = Math.hypot(hx - camPos.x, hy - camPos.y, hz - camPos.z);
    if (dist < 0.10 || dist > state.xrMaxRange) return;

    // 1. Всегда подаем данные с LiDAR в систему Ночного Видения (даже когда запись 3D-модели выключена!)
    registerRadarNodeForNV(hx, hy, hz, dist, gx, gy);

    // 2. Если включен режим записи 3D-скана — сохраняем в воксельную модель
    if (!state.xrIsNightVisionOnly && state.xrRecording) {
      if (!state.xrCenterAnchor) {
        state.xrCenterAnchor = { x: hx, y: hy, z: hz };
      }
      var distCenter = Math.hypot(hx - state.xrCenterAnchor.x, hz - state.xrCenterAnchor.z);
      if (distCenter <= state.xrMaxRange * 0.75) {
        var ang = Math.atan2(camPos.x - state.xrCenterAnchor.x, camPos.z - state.xrCenterAnchor.z);
        var sec = Math.floor((((ang * 180) / Math.PI + 360) % 360) / 15) % 24;
        state.sectorsCaptured[sec] = 1;
        state.gyroYawRad = ang;
        putVoxel(hx - state.xrCenterAnchor.x, hy - state.xrCenterAnchor.y, hz - state.xrCenterAnchor.z, 34, 240, 195, 2);
      }
    }
  }

  // Запускает настоящий аппаратный LiDAR (в режиме ПНВ или в режиме 3D-Скана)
  function startHardwareLiDAR(startInNVMode) {
    state.xrIsNightVisionOnly = !!startInNVMode;
    updateXRModeButtons();

    if (!navigator.xr) {
      // Если открыто в обычном браузере (Яндекс/Safari без WebXR), открываем окно ПНВ с ИК-матрицей
      if (startInNVMode) {
        openFallbackNVModal();
      } else {
        startGyroOrbitScan();
      }
      return;
    }

    // Закрываем обычное модальное окно, если оно было открыто, чтобы включить аппаратный LiDAR
    state.nvModalOpen = false;
    document.getElementById('nvStandaloneModal').style.display = 'none';

    navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['hit-test', 'depth-sensing', 'dom-overlay'],
      domOverlay: { root: document.body }
    }).catch(function() {
      return navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['hit-test'] });
    }).catch(function() {
      return navigator.xr.requestSession('immersive-ar');
    }).then(function(session) {
      state.xrSession = session;
      state.mode = 'lidar';
      state.xrRadarNodes = [];
      document.body.classList.add('xr-active');

      if (!xrGlCanvas) {
        xrGlCanvas = document.createElement('canvas');
        xrGl = xrGlCanvas.getContext('webgl', { xrCompatible: true, alpha: true });
      }
      if (xrGl && typeof XRWebGLLayer !== 'undefined') {
        try { session.updateRenderState({ baseLayer: new XRWebGLLayer(session, xrGl) }); } catch (e) {}
      }

      session.requestReferenceSpace('local').catch(function() {
        return session.requestReferenceSpace('viewer');
      }).then(function(rs) { xrRefSpace = rs; });

      session.requestReferenceSpace('viewer').then(function(vs) {
        if (session.requestHitTestSource) {
          session.requestHitTestSource({ space: vs }).then(function(s) { xrHitTestSource = s; }).catch(function() {});
        }
      }).catch(function() {});

      var onXRFrame = function(now, frame) {
        if (!state.xrSession) return;
        session.requestAnimationFrame(onXRFrame);

        if (xrGl && session.renderState.baseLayer) {
          xrGl.bindFramebuffer(xrGl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);
          xrGl.clearColor(0, 0, 0, 0);
          xrGl.clear(xrGl.COLOR_BUFFER_BIT | xrGl.DEPTH_BUFFER_BIT);
        }

        if (!xrRefSpace) return;
        var pose = frame.getViewerPose(xrRefSpace);
        if (!pose) return;

        var camPos = pose.transform.position;
        var view = pose.views[0];
        if (view) {
          lastViewMatrix = view.transform.inverse.matrix;
          lastProjMatrix = view.projectionMatrix;
        }

        // 1. Центральный дальномер LiDAR
        if (xrHitTestSource) {
          try {
            var hits = frame.getHitTestResults(xrHitTestSource);
            if (hits.length > 0) {
              var hp = hits[0].getPose(xrRefSpace).transform.position;
              var cDist = Math.hypot(hp.x - camPos.x, hp.y - camPos.y, hp.z - camPos.z);
              document.getElementById('xrCenterDistTag').textContent = cDist.toFixed(2) + ' м';
              onARKitHit(hp.x, hp.y, hp.z, camPos, 0, 0);
            }
          } catch (e) {}
        }

        // 2. Матрица из 49 ИК-лучей LiDAR (работает в полной темноте!)
        if (typeof session.requestHitTest === 'function' && view) {
          var m = view.transform.matrix;
          var orig = new Float32Array([camPos.x, camPos.y, camPos.z]);

          for (var k = 0; k < 7; k++) {
            var ray = lidarMatrixRays[rayCursor % lidarMatrixRays.length];
            rayCursor++;
            var wx = m[0] * ray.x + m[4] * ray.y - m[8];
            var wy = m[1] * ray.x + m[5] * ray.y - m[9];
            var wz = m[2] * ray.x + m[6] * ray.y - m[10];
            var len = Math.hypot(wx, wy, wz) || 1;

            (function(rObj) {
              session.requestHitTest(orig, new Float32Array([wx / len, wy / len, wz / len]), xrRefSpace).then(function(res) {
                if (res && res.length > 0 && res[0].hitMatrix) {
                  var hm = res[0].hitMatrix;
                  var d = Math.hypot(hm[12] - camPos.x, hm[13] - camPos.y, hm[14] - camPos.z);
                  if (rObj.gx === 0 && rObj.gy === 0) {
                    document.getElementById('xrCenterDistTag').textContent = d.toFixed(2) + ' м';
                  }
                  onARKitHit(hm[12], hm[13], hm[14], camPos, rObj.gx, rObj.gy);
                }
              }).catch(function() {});
            })(ray);
          }
        }

        renderXRLidarNightVisionHUD(now);
      };
      session.requestAnimationFrame(onXRFrame);
      session.addEventListener('end', finishXR);
    }).catch(function() {
      if (startInNVMode) openFallbackNVModal();
      else startGyroOrbitScan();
    });
  }

  // Отрисовка лазерной LiDAR-сетки ПНВ в реальном времени поверх темноты
  function renderXRLidarNightVisionHUD(now) {
    var w = window.innerWidth, h = window.innerHeight;
    if (xrHudCanvas.width !== w || xrHudCanvas.height !== h) {
      xrHudCanvas.width = w; xrHudCanvas.height = h;
    }
    xrHudCtx.clearRect(0, 0, w, h);

    if (state.xrIsNightVisionOnly) {
      // Фосфорный зеленый фильтр ночного видения + скан-линии поверх камеры и LiDAR
      xrHudCtx.fillStyle = 'rgba(2, 28, 10, 0.32)';
      xrHudCtx.fillRect(0, 0, w, h);
    }

    if (!lastViewMatrix || !lastProjMatrix) return;

    // 1. Рисуем живую лазерную матрицу LiDAR (зеленые ИК-узлы с соединительной сеткой препятствий в темноте)
    var nodes = state.xrRadarNodes;
    var projNodes = [];

    for (var i = 0; i < nodes.length; i++) {
      var nd = nodes[i];
      var age = now - nd.t;
      if (age > 2800) continue; // Точки ПНВ плавно гаснут через 2.8 сек при переводе взгляда, чтобы не было каши!

      var vx = lastViewMatrix[0] * nd.x + lastViewMatrix[4] * nd.y + lastViewMatrix[8] * nd.z + lastViewMatrix[12];
      var vy = lastViewMatrix[1] * nd.x + lastViewMatrix[5] * nd.y + lastViewMatrix[9] * nd.z + lastViewMatrix[13];
      var vz = lastViewMatrix[2] * nd.x + lastViewMatrix[6] * nd.y + lastViewMatrix[10] * nd.z + lastViewMatrix[14];

      if (vz < -0.08) {
        var sx = ((lastProjMatrix[0] * vx + lastProjMatrix[8] * vz) / (-vz) * 0.5 + 0.5) * w;
        var sy = (1.0 - ((lastProjMatrix[5] * vy + lastProjMatrix[9] * vz) / (-vz) * 0.5 + 0.5)) * h;
        if (sx >= 0 && sx <= w && sy >= 0 && sy <= h) {
          var alpha = Math.max(0.15, 1 - age / 2800);
          var closeness = Math.max(0, Math.min(1, 1 - nd.dist / state.xrMaxRange));
          projNodes.push({ sx: sx, sy: sy, dist: nd.dist, alpha: alpha, closeness: closeness });
        }
      }
    }

    // Соединяем близкие лазерные точки LiDAR в зеленую пространственную сетку ПНВ
    xrHudCtx.lineWidth = 1.2;
    for (var a = 0; a < projNodes.length; a++) {
      var pa = projNodes[a];
      for (var b = a + 1; b < Math.min(projNodes.length, a + 12); b++) {
        var pb = projNodes[b];
        var dScreen = (pa.sx - pb.sx) * (pa.sx - pb.sx) + (pa.sy - pb.sy) * (pa.sy - pb.sy);
        if (dScreen < 6500 && Math.abs(pa.dist - pb.dist) < 0.25) {
          xrHudCtx.strokeStyle = 'rgba(74, 222, 128, ' + (pa.alpha * 0.45).toFixed(2) + ')';
          xrHudCtx.beginPath();
          xrHudCtx.moveTo(pa.sx, pa.sy);
          xrHudCtx.lineTo(pb.sx, pb.sy);
          xrHudCtx.stroke();
        }
      }

      // Яркость узла зависит от близости препятствия по LiDAR
      var sz = 3 + pa.closeness * 4;
      xrHudCtx.fillStyle = pa.closeness > 0.7
        ? 'rgba(134, 239, 172, ' + pa.alpha.toFixed(2) + ')'
        : 'rgba(34, 197, 94, ' + pa.alpha.toFixed(2) + ')';
      xrHudCtx.fillRect(pa.sx - sz * 0.5, pa.sy - sz * 0.5, sz, sz);
    }

    // 2. Если включен режим записи 3D-скана — показываем также накопленные точки 3D-модели
    if (!state.xrIsNightVisionOnly && state.xrCenterAnchor) {
      var anc = state.xrCenterAnchor;
      xrHudCtx.fillStyle = '#00f5d4';
      for (var j = 0; j < activeVertCount; j++) {
        var px = vertsX[j] + anc.x, py = vertsY[j] + anc.y, pz = vertsZ[j] + anc.z;
        var vx2 = lastViewMatrix[0] * px + lastViewMatrix[4] * py + lastViewMatrix[8] * pz + lastViewMatrix[12];
        var vy2 = lastViewMatrix[1] * px + lastViewMatrix[5] * py + lastViewMatrix[9] * pz + lastViewMatrix[13];
        var vz2 = lastViewMatrix[2] * px + lastViewMatrix[6] * py + lastViewMatrix[10] * pz + lastViewMatrix[14];
        if (vz2 < -0.1) {
          var sx2 = ((lastProjMatrix[0] * vx2 + lastProjMatrix[8] * vz2) / (-vz2) * 0.5 + 0.5) * w;
          var sy2 = (1.0 - ((lastProjMatrix[5] * vy2 + lastProjMatrix[9] * vz2) / (-vz2) * 0.5 + 0.5)) * h;
          if (sx2 >= 0 && sx2 <= w && sy2 >= 0 && sy2 <= h) {
            xrHudCtx.fillRect(sx2 - 1.5, sy2 - 1.5, 3, 3);
          }
        }
      }
    }
  }

  function updateXRModeButtons() {
    var bNV = document.getElementById('btnXrModeNV');
    var bScan = document.getElementById('btnXrModeScan');
    if (state.xrIsNightVisionOnly) {
      bNV.classList.add('btn-active');
      bScan.classList.remove('btn-active');
    } else {
      bScan.classList.add('btn-active');
      bNV.classList.remove('btn-active');
    }
  }

  function finishXR() {
    document.body.classList.remove('xr-active');
    xrHudCtx.clearRect(0, 0, xrHudCanvas.width, xrHudCanvas.height);
    if (state.xrSession) {
      var s = state.xrSession;
      state.xrSession = null;
      try { s.end(); } catch (e) {}
    }
    if (activeVertCount > 0) {
      state.isFrozen = true;
      state.meshDirty = true;
      document.getElementById('freezeBtnText').textContent = '▶️ Пуск';
    }
  }

  // =========================================================
  // 4. ОКНО ПНВ С ЛАЗЕРНОЙ МАТРИЦЕЙ (ДЛЯ БРАУЗЕРОВ БЕЗ WEBXR + ПЕРЕХОД В XR)
  // =========================================================
  var nvModal = document.getElementById('nvStandaloneModal');
  var nvCanvas = document.getElementById('nvStandaloneCanvas');
  var nvCtx = nvCanvas.getContext('2d');
  var nvWorkCanvas = document.createElement('canvas');
  var nvWorkCtx = nvWorkCanvas.getContext('2d');

  function openFallbackNVModal() {
    state.nvModalOpen = true;
    nvModal.style.display = 'flex';
    if (!state.isCameraActive && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: state.facingMode } })
        .then(function(s) { videoEl.srcObject = s; videoEl.play().catch(function(){}); state.isCameraActive = true; })
        .catch(function(){});
    }
  }

  function renderStandaloneNV() {
    if (!state.nvModalOpen) return;
    var w = 280, h = 210;
    if (nvCanvas.width !== w) { nvCanvas.width = w; nvCanvas.height = h; nvWorkCanvas.width = w; nvWorkCanvas.height = h; }
    if (state.isCameraActive && videoEl.readyState >= 2) {
      nvWorkCtx.drawImage(videoEl, 0, 0, w, h);
      var frame = nvWorkCtx.getImageData(0, 0, w, h);
      var d = frame.data, gain = state.nvGain;
      var lum = new Float32Array(w * h);
      for (var i = 0, p = 0; i < d.length; i += 4, p++) {
        var l = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
        lum[p] = Math.min(1.0, Math.pow(l, 0.5) * (gain * 0.48));
      }
      for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
          var idx = y * w + x, val = lum[idx];
          if (x > 0 && x < w - 1 && y > 0 && y < h - 1) {
            var gx = lum[idx + 1] - lum[idx - 1], gy = lum[idx + w] - lum[idx - w];
            val = Math.min(1.0, val * 0.8 + Math.min(1.0, Math.hypot(gx, gy) * 3.0) * 0.7);
          }
          var di = idx * 4, gVal = Math.round(val * 255);
          d[di] = Math.round(gVal * 0.10); d[di + 1] = gVal; d[di + 2] = Math.round(gVal * 0.18);
        }
      }
      nvCtx.putImageData(frame, 0, 0);

      // Лазерная ИК-сетка матричного дальномера поверх ПНВ
      if (state.nvShowLidarGrid) {
        nvCtx.strokeStyle = 'rgba(74, 222, 128, 0.35)';
        nvCtx.lineWidth = 0.7;
        var stepX = 20, stepY = 18;
        for (var gy2 = stepY; gy2 < h - stepY; gy2 += stepY) {
          nvCtx.beginPath();
          for (var gx2 = stepX; gx2 < w - stepX; gx2 += stepX) {
            var lVal = lum[gy2 * w + gx2];
            var dispY = gy2 - (lVal - 0.3) * 14;
            if (gx2 === stepX) nvCtx.moveTo(gx2, dispY);
            else nvCtx.lineTo(gx2, dispY);
            nvCtx.fillStyle = lVal > 0.55 ? '#86efac' : '#22c55e';
            nvCtx.fillRect(gx2 - 1.2, dispY - 1.2, 2.4, 2.4);
          }
          nvCtx.stroke();
        }
      }
    }
  }

  // =========================================================
  // 5. ЗАПУСК 360° ОБХОДА С КАМЕРОЙ И ГИРОСКОПОМ
  // =========================================================
  function startGyroOrbitScan() {
    enableGyro(function() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (navigator.xr) startHardwareLiDAR(false);
        return;
      }
      try {
        if (videoEl.srcObject) videoEl.srcObject.getTracks().forEach(function(t) { t.stop(); });
      } catch (e) {}

      navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: state.facingMode, width: { ideal: 480 }, height: { ideal: 360 } }
      }).catch(function() {
        return navigator.mediaDevices.getUserMedia({ audio: false, video: true });
      }).then(function(stream) {
        videoEl.srcObject = stream;
        videoEl.play().catch(function() {});
        state.isCameraActive = true;
        state.mode = 'orbit';
        state.isFrozen = false;
        state.baseAlpha = null;
        document.getElementById('pipBox').style.display = 'block';
        document.getElementById('btnSnapSector').style.display = 'inline-flex';
        document.getElementById('btnGyroScanText').textContent = 'Скан активен';
        document.getElementById('freezeBtnText').textContent = '❄️ Стоп';
        setTimeout(function() { captureObjectFrameWithCap(0); }, 300);
      }).catch(function() {
        if (navigator.xr) startHardwareLiDAR(false);
      });
    });
  }

  // =========================================================
  // 6. ОТРИСОВКА 3D-ВЬЮПОРТА
  // =========================================================
  var projX = new Float32Array(MAX_VERTS);
  var projY = new Float32Array(MAX_VERTS);

  function render3DViewport() {
    var box = document.getElementById('viewportBox');
    var w = box.clientWidth || 360, h = box.clientHeight || 460;
    if (mainCanvas.width !== w || mainCanvas.height !== h) {
      mainCanvas.width = w; mainCanvas.height = h;
    }

    ctx.fillStyle = '#04070e';
    ctx.fillRect(0, 0, w, h);

    var cosY = Math.cos(state.yaw), sinY = Math.sin(state.yaw);
    var cosX = Math.cos(state.pitch), sinX = Math.sin(state.pitch);
    var fov = Math.min(w, h) * 0.88;
    var camDist = state.zoom;

    var floorY = -0.65;
    ctx.lineWidth = 2;
    for (var s = 0; s < 24; s++) {
      var a0 = (s * 15) * (Math.PI / 180);
      var a1 = ((s + 1) * 15) * (Math.PI / 180);
      var rad = 0.65;
      var x0 = Math.sin(a0) * rad, z0 = Math.cos(a0) * rad;
      var x1 = Math.sin(a1) * rad, z1 = Math.cos(a1) * rad;

      var rx0 = x0 * cosY + z0 * sinY, rz0 = -x0 * sinY + z0 * cosY;
      var ry0 = floorY * cosX - rz0 * sinX, d0 = floorY * sinX + rz0 * cosX + camDist;
      var rx1 = x1 * cosY + z1 * sinY, rz1 = -x1 * sinY + z1 * cosY;
      var ry1 = floorY * cosX - rz1 * sinX, d1 = floorY * sinX + rz1 * cosX + camDist;

      if (d0 > 0.2 && d1 > 0.2) {
        ctx.strokeStyle = state.sectorsCaptured[s] ? '#10b981' : 'rgba(56, 189, 248, 0.18)';
        ctx.beginPath();
        ctx.moveTo(w * 0.5 + (rx0 / d0) * fov, h * 0.5 - (ry0 / d0) * fov);
        ctx.lineTo(w * 0.5 + (rx1 / d1) * fov, h * 0.5 - (ry1 / d1) * fov);
        ctx.stroke();
      }
    }

    var n = activeVertCount;
    if (n === 0) return;

    for (var i = 0; i < n; i++) {
      var x = vertsX[i], y = vertsY[i], z = vertsZ[i];
      var rx = x * cosY + z * sinY;
      var rz = -x * sinY + z * cosY;
      var ry = y * cosX - rz * sinX;
      var fz = y * sinX + rz * cosX + camDist;
      if (fz > 0.15) {
        projX[i] = w * 0.5 + (rx / fz) * fov;
        projY[i] = h * 0.5 - (ry / fz) * fov;
      } else {
        projX[i] = -9999;
      }
    }

    var st = state.vizStyle;
    if (st !== 'points') {
      buildCleanMeshIfNeeded();
      var tris = state.meshTriangles;
      for (var t = 0; t < tris.length; t += 3) {
        var a = tris[t], b = tris[t + 1], c = tris[t + 2];
        var ax = projX[a], bx = projX[b], cx = projX[c];
        if (ax > -900 && bx > -900 && cx > -900) {
          var ay = projY[a], by = projY[b], cy = projY[c];
          var cr = vertsR[a], cg = vertsG[a], cb = vertsB[a];
          if (st === 'solid' || st === 'combined') {
            ctx.fillStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
            ctx.beginPath();
            ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy);
            ctx.fill();
          }
          if (st === 'wireframe' || st === 'combined') {
            ctx.strokeStyle = st === 'wireframe' ? 'rgb(' + cr + ',' + cg + ',' + cb + ')' : 'rgba(0, 245, 212, 0.3)';
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy);
            ctx.stroke();
          }
        }
      }
    }

    if (st === 'points' || st === 'combined' || state.meshTriangles.length === 0) {
      var pSize = st === 'points' ? 4.2 : 2.8;
      var half = pSize * 0.5;
      for (var j = 0; j < n; j++) {
        var sx = projX[j];
        if (sx >= 0 && sx <= w) {
          var sy = projY[j];
          if (sy >= 0 && sy <= h) {
            ctx.fillStyle = 'rgb(' + vertsR[j] + ',' + vertsG[j] + ',' + vertsB[j] + ')';
            ctx.fillRect(sx - half, sy - half, pSize, pSize);
          }
        }
      }
    }
  }

  var isDragging = false, lastX = 0, lastY = 0;
  var vpBox = document.getElementById('viewportBox');
  vpBox.addEventListener('pointerdown', function(e) {
    if (e.target.tagName === 'BUTTON') return;
    isDragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    state.yaw += (e.clientX - lastX) * 0.008;
    state.pitch = Math.max(-1.3, Math.min(1.3, state.pitch + (e.clientY - lastY) * 0.008));
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('pointerup', function() { isDragging = false; });

  // =========================================================
  // 7. ЭКСПОРТ .OBJ И .PLY
  // =========================================================
  var NL = String.fromCharCode(10);
  function downloadFile(text, name) {
    var blob = new Blob([text], { type: 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('btnExportOBJ').addEventListener('click', function() {
    if (activeVertCount === 0) return;
    buildCleanMeshIfNeeded();
    var lines = ['# 3D Scan Export v13', 'o ScannedObject'];
    for (var i = 0; i < activeVertCount; i++) {
      lines.push('v ' + vertsX[i].toFixed(4) + ' ' + vertsY[i].toFixed(4) + ' ' + vertsZ[i].toFixed(4) + ' ' + (vertsR[i]/255).toFixed(3) + ' ' + (vertsG[i]/255).toFixed(3) + ' ' + (vertsB[i]/255).toFixed(3));
    }
    var tris = state.meshTriangles;
    for (var t = 0; t < tris.length; t += 3) {
      lines.push('f ' + (tris[t] + 1) + ' ' + (tris[t + 1] + 1) + ' ' + (tris[t + 2] + 1));
    }
    downloadFile(lines.join(NL), 'scan-' + Date.now() + '.obj');
  });

  document.getElementById('btnExportPLY').addEventListener('click', function() {
    if (activeVertCount === 0) return;
    var lines = [
      'ply', 'format ascii 1.0', 'element vertex ' + activeVertCount,
      'property float x', 'property float y', 'property float z',
      'property uchar red', 'property uchar green', 'property uchar blue', 'end_header'
    ];
    for (var i = 0; i < activeVertCount; i++) {
      lines.push(vertsX[i].toFixed(4) + ' ' + vertsY[i].toFixed(4) + ' ' + vertsZ[i].toFixed(4) + ' ' + vertsR[i] + ' ' + vertsG[i] + ' ' + vertsB[i]);
    }
    downloadFile(lines.join(NL), 'cloud-' + Date.now() + '.ply');
  });

  // =========================================================
  // 8. КНОПКИ И ПОЛЗУНКИ
  // =========================================================
  document.getElementById('btnStartGyroScan').addEventListener('click', startGyroOrbitScan);
  document.getElementById('btnStartLiDAR').addEventListener('click', function() {
    startHardwareLiDAR(false);
  });

  // Кнопка "👁 ПНВ + LiDAR" сразу включает аппаратный LiDAR в режиме Ночного Видения!
  document.getElementById('btnOpenNVWindow').addEventListener('click', function() {
    startHardwareLiDAR(true);
  });
  document.getElementById('btnNvActivateLiDAR').addEventListener('click', function() {
    startHardwareLiDAR(true);
  });

  document.getElementById('btnXrModeNV').addEventListener('click', function() {
    state.xrIsNightVisionOnly = true;
    updateXRModeButtons();
  });
  document.getElementById('btnXrModeScan').addEventListener('click', function() {
    state.xrIsNightVisionOnly = false;
    state.xrRecording = true;
    updateXRModeButtons();
  });

  document.getElementById('btnFillCap').addEventListener('click', function(e) {
    state.fillTopCap = !state.fillTopCap;
    e.currentTarget.classList.toggle('btn-active', state.fillTopCap);
  });

  document.getElementById('btnSnapSector').addEventListener('click', function() {
    var sec = Math.floor(state.rawAlpha / 15) % 24;
    captureObjectFrameWithCap(sec);
  });

  document.getElementById('btnGyroViewLink').addEventListener('click', function(e) {
    if (!state.gyroEnabled) enableGyro();
    state.gyroViewControl = !state.gyroViewControl;
    e.currentTarget.classList.toggle('btn-active', state.gyroViewControl);
  });

  document.getElementById('btnCloseNV').addEventListener('click', function() {
    state.nvModalOpen = false;
    nvModal.style.display = 'none';
  });
  document.getElementById('btnNvSwitchCam').addEventListener('click', function() {
    state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
    openFallbackNVModal();
  });

  document.getElementById('btnSwitchCam').addEventListener('click', function() {
    state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
    startGyroOrbitScan();
  });

  document.getElementById('btnLockCenterXR').addEventListener('click', function() { state.xrCenterAnchor = null; });
  document.getElementById('btnFinishXR').addEventListener('click', finishXR);
  document.getElementById('btnSaveScanXR').addEventListener('click', finishXR);
  document.getElementById('btnClearXR').addEventListener('click', function() {
    activeVertCount = 0;
    state.voxelMap.clear();
    state.meshTriangles = [];
    state.xrRadarNodes = [];
    state.sectorsCaptured.fill(0);
    state.xrCenterAnchor = null;
  });
  document.getElementById('sliderXrRange').addEventListener('input', function(e) {
    state.xrMaxRange = parseFloat(e.target.value);
    document.getElementById('xrRangeVal').textContent = state.xrMaxRange.toFixed(1) + ' м';
  });

  document.getElementById('btnClearScene').addEventListener('click', function() {
    activeVertCount = 0;
    state.voxelMap.clear();
    state.meshTriangles = [];
    state.sectorsCaptured.fill(0);
    state.lastCapturedSector = -1;
  });

  document.getElementById('btnFreeze').addEventListener('click', function() {
    state.isFrozen = !state.isFrozen;
    document.getElementById('freezeBtnText').textContent = state.isFrozen ? '▶️ Пуск' : '❄️ Стоп';
  });

  document.getElementById('btnAutoRotate').addEventListener('click', function(e) {
    state.autoRotate = !state.autoRotate;
    e.currentTarget.classList.toggle('btn-active', state.autoRotate);
  });

  document.getElementById('btnResetView').addEventListener('click', function() {
    state.yaw = 0.4; state.pitch = 0.42; state.zoom = 2.3; state.baseAlpha = null;
  });

  document.querySelectorAll('.style-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.style-btn').forEach(function(b) { b.classList.remove('btn-active'); });
      btn.classList.add('btn-active');
      state.vizStyle = btn.getAttribute('data-style');
      if (state.vizStyle !== 'points') state.meshDirty = true;
    });
  });

  document.querySelectorAll('.color-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.color-btn').forEach(function(b) { b.classList.remove('btn-active'); });
      btn.classList.add('btn-active');
      state.colorTheme = btn.getAttribute('data-color');
    });
  });

  document.getElementById('sliderCropFocus').addEventListener('input', function(e) {
    var v = parseInt(e.target.value, 10);
    state.cropFocus = v / 100;
    document.getElementById('valCropFocus').textContent = v + '%';
    var insetPct = Math.round((v / 100) * 28);
    document.getElementById('pipCropBox').style.inset = insetPct + '%';
  });

  document.getElementById('sliderThreshold').addEventListener('input', function(e) {
    var v = parseInt(e.target.value, 10);
    state.bgThreshold = v / 100;
    document.getElementById('valThreshold').textContent = v + '%';
  });

  document.getElementById('sliderDepthScale').addEventListener('input', function(e) {
    state.depthScale = parseFloat(e.target.value);
    document.getElementById('valDepthScale').textContent = state.depthScale.toFixed(1) + 'x';
  });

  document.getElementById('chkAutoOrbitCapture').addEventListener('change', function(e) {
    state.autoOrbitCapture = e.target.checked;
  });

  document.getElementById('sliderNvModalGain').addEventListener('input', function(e) {
    state.nvGain = parseFloat(e.target.value);
    document.getElementById('nvGainLabel').textContent = state.nvGain.toFixed(1) + 'x';
  });
  document.getElementById('chkNvLidarGrid').addEventListener('change', function(e) {
    state.nvShowLidarGrid = e.target.checked;
  });

  var lastT = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    var dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;

    if (state.nvModalOpen) {
      renderStandaloneNV();
      return;
    }
    if (state.xrSession) return;

    if (state.autoRotate) state.yaw += dt * 0.6;

    drawOrbitRadar();
    render3DViewport();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
